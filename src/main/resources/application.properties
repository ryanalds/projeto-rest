spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# Configure JWT_SECRET com uma chave Base64 de pelo menos 256 bits.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.auth.username=${APP_USER_USERNAME:ryan}
app.auth.password=${APP_USER_PASSWORD}

app.providers.rickandmorty.base-url=${RICKANDMORTY_API_URL:https://rickandmortyapi.com/api}
app.providers.simpsons.base-url=${SIMPSONS_API_URL:https://thesimpsonsapi.com/api}
app.providers.connect-timeout-ms=${PROVIDER_CONNECT_TIMEOUT_MS:2000}
app.providers.read-timeout-ms=${PROVIDER_READ_TIMEOUT_MS:5000}
app.cache.ttl-minutes=${CACHE_TTL_MINUTES:10}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:8080}

management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
